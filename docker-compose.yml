services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No schema mount. scripts/schema.sql never existed, and Docker silently
    # created a *directory* at that path rather than failing, so the mount was a
    # lie that looked fine. Nothing uses Postgres yet — alert history has no
    # route — so it stays empty until something needs a table.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
